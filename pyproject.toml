[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-operations-engine"
version = "0.1.0"
description = "Retail inventory, sales, customer credit, analytics, and alerts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy",
    "pandas",
    "numpy",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "alembic>=1.14,<2",
]

[tool.setuptools.packages.find]
include = ["retail_ops*"]
